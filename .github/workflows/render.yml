name: Render Video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nama folder video di public/ (contoh: video1)"
        required: true
        default: "video1"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang ffmpeg + numpy/scipy (untuk audio)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install numpy scipy
      - run: npm install
      - name: Siapkan (timing dari SRT, lip-sync, musik di-duck, SFX)
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: python3 tools/prepare.py "$VIDEO"
      - name: Render
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: |
          mkdir -p out
          echo "{\"name\":\"$VIDEO\"}" > props.json
          npx remotion render src/index.ts Cerita "out/$VIDEO.mp4" --props=props.json --crf=20
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}
          path: out/*.mp4
