name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "ID komposisi. Bisa satu (Motivasi), beberapa dipisah spasi (Motivasi HelloWorld), atau ALL untuk semuanya"
        required: true
        default: "ALL"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Render
        env:
          INPUT: ${{ github.event.inputs.composition }}
        run: |
          mkdir -p out
          if [ "$INPUT" = "ALL" ]; then
            IDS=$(npx remotion compositions src/index.ts --quiet)
          else
            IDS="$INPUT"
          fi
          echo "Akan dirender: $IDS"
          for id in $IDS; do
            npx remotion render src/index.ts "$id" "out/$id.mp4"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/*.mp4
