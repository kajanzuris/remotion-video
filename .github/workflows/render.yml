name: Render Video
on:
  workflow_dispatch:
    inputs:
      video:
        description: "Nama folder video di public/ (contoh: video2)"
        required: true
        default: "video1"
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Render
        env:
          VIDEO: ${{ github.event.inputs.video }}
        run: |
          mkdir -p out
          echo "{\"name\":\"$VIDEO\"}" > props.json
          npx remotion render src/index.ts Cerita "out/$VIDEO.mp4" --props=props.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.video }}
          path: out/*.mp4
